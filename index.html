<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Scanner</title>

<style>
body{
background:#0a0f1f;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.card{
background:#111827;
border:1px solid #00d084;
border-radius:15px;
padding:15px;
margin-top:15px;
}

button{
background:#00d084;
border:none;
padding:10px;
border-radius:10px;
width:100%;
font-size:16px;
}
</style>
</head>
<body>

<h1>🚗 Auto Scanner</h1>

<div id="autos"></div>

<script>
fetch("autos.json")
.then(r=>r.json())
.then(data=>{

const container=document.getElementById("autos");

data.forEach(auto=>{

container.innerHTML+=`
<div class="card">
<h2>${auto.title}</h2>
<p>${auto.km}</p>
<p>${auto.distance}</p>
<a href="${auto.url}" target="_blank">
<button>Inserat öffnen</button>
</a>
</div>
`;

});

});
</script>

</body>
</html>
