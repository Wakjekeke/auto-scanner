<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Scanner</title>

<style>
body{
background:#0a0f1f;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.card{
background:#111827;
border:1px solid #00d084;
border-radius:15px;
padding:15px;
margin-top:15px;
}

button{
background:#00d084;
border:none;
padding:10px;
border-radius:10px;
font-size:16px;
width:100%;
}
</style>
</head>

<body>

<h1>🚗 Auto Scanner</h1>

<div class="card">
<h2>BMW E46 320i</h2>
<p>197.000 km</p>
<p>18 km entfernt</p>
<button>Inserat öffnen</button>
</div>

<div class="card">
<h2>Golf GTI</h2>
<p>150.000 km</p>
<p>30 km entfernt</p>
<button>Inserat öffnen</button>
</div>

</body>
</html>
